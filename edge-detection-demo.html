<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge detection demo</title>
<style>
  :root {
    --bg: #14181c; --panel: #1d242b; --text: #e8edf1; --muted: #9aa7b2; --accent: #4cc9f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
           background: var(--panel); }
  h1 { font-size: 18px; margin: 0 12px 0 0; font-weight: 600; }
  label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  select, button { background: var(--bg); color: var(--text); border: 1px solid #3a4651;
                   border-radius: 6px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #stage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  #stage.single { grid-template-columns: 1fr; }
  figure { margin: 0; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
  figcaption { position: absolute; left: 10px; top: 8px; font-size: 13px; background: rgba(0,0,0,.6);
               padding: 2px 8px; border-radius: 4px; }
  video, canvas { width: 100%; height: auto; display: block; }
  #msg { padding: 12px 20px; color: #ffb4a2; display: none; }
  @media (max-width: 800px) { #stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Edge detection from the webcam</h1>
  <label>Method
    <select id="method">
      <option value="sobel">Sobel (gradient magnitude)</option>
      <option value="canny">Canny-style (thin edges)</option>
    </select>
  </label>
  <label>Threshold <input id="thresh" type="range" min="5" max="200" value="60"><span id="threshVal">60</span></label>
  <label>Blur <input id="blur" type="range" min="0" max="4" value="1"><span id="blurVal">1</span></label>
  <label><input id="invert" type="checkbox"> Invert</label>
  <label><input id="sideBySide" type="checkbox" checked> Show original</label>
  <label>Camera <select id="camera"></select></label>
  <button id="start">Start camera</button>
  <button id="full">Fullscreen</button>
</header>
<div id="msg"></div>
<div id="stage">
  <figure id="origFig"><video id="video" playsinline muted></video><figcaption>Camera</figcaption></figure>
  <figure><canvas id="out"></canvas><figcaption id="outCap">Edges</figcaption></figure>
</div>

<script>
// ---- Setup -------------------------------------------------------------
const video = document.getElementById('video');
const out = document.getElementById('out');
const octx = out.getContext('2d', { willReadFrequently: true });
const work = document.createElement('canvas');           // small hidden canvas for processing
const wctx = work.getContext('2d', { willReadFrequently: true });
const $ = id => document.getElementById(id);

const WORK_W = 480;   // processing width; lower = faster, higher = finer edges
let stream = null, running = false;

function show(text) { const m = $('msg'); m.textContent = text; m.style.display = text ? 'block' : 'none'; }

// ---- Camera ------------------------------------------------------------
async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (e) {
    show('Could not open the camera: ' + e.message +
         '. Allow camera access in the browser, and open this page from a file or an https address.');
    return;
  }
  show('');
  video.srcObject = stream;
  await video.play();
  const h = Math.round(WORK_W * video.videoHeight / video.videoWidth);
  work.width = out.width = WORK_W; work.height = out.height = h;
  await listCameras(stream.getVideoTracks()[0].getSettings().deviceId);
  if (!running) { running = true; requestAnimationFrame(loop); }
}

async function listCameras(current) {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const sel = $('camera'); sel.innerHTML = '';
  devices.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || 'Camera ' + (i + 1);
    if (d.deviceId === current) o.selected = true;
    sel.appendChild(o);
  });
}

// ---- Image processing --------------------------------------------------
// Everything below works on a flat grayscale array (one number per pixel).

function toGray(img) {
  const d = img.data, g = new Float32Array(img.width * img.height);
  for (let i = 0, j = 0; i < d.length; i += 4, j++)
    g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  return g;
}

// Box blur repeated n times approximates a Gaussian blur and removes camera noise.
function blur(g, w, h, n) {
  let src = g, dst = new Float32Array(g.length);
  for (let k = 0; k < n; k++) {
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      dst[i] = (src[i-w-1] + src[i-w] + src[i-w+1] + src[i-1] + src[i] + src[i+1] + src[i+w-1] + src[i+w] + src[i+w+1]) / 9;
    }
    [src, dst] = [dst, src];
  }
  return src;
}

// Sobel: two 3x3 kernels estimate the brightness gradient in x and y.
// Large gradient = rapid brightness change = edge.
function sobel(g, w, h) {
  const mag = new Float32Array(w * h), dir = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const gx = -g[i-w-1] + g[i-w+1] - 2*g[i-1] + 2*g[i+1] - g[i+w-1] + g[i+w+1];
    const gy = -g[i-w-1] - 2*g[i-w] - g[i-w+1] + g[i+w-1] + 2*g[i+w] + g[i+w+1];
    mag[i] = Math.hypot(gx, gy) / 4;
    dir[i] = Math.atan2(gy, gx);
  }
  return { mag, dir };
}

// Non-maximum suppression: keep a pixel only if it is the strongest along its
// gradient direction. This thins thick edges to a single-pixel line (core of Canny).
function thin(mag, dir, w, h) {
  const r = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    let a = dir[i] * 180 / Math.PI; if (a < 0) a += 180;
    let n1, n2;
    if (a < 22.5 || a >= 157.5) { n1 = mag[i-1]; n2 = mag[i+1]; }
    else if (a < 67.5)          { n1 = mag[i-w+1]; n2 = mag[i+w-1]; }
    else if (a < 112.5)         { n1 = mag[i-w]; n2 = mag[i+w]; }
    else                        { n1 = mag[i-w-1]; n2 = mag[i+w+1]; }
    r[i] = (mag[i] >= n1 && mag[i] >= n2) ? mag[i] : 0;
  }
  return r;
}

// Hysteresis: strong edges are kept; weak edges survive only if touching a strong one.
function hysteresis(m, w, h, lo, hi) {
  const res = new Uint8Array(w * h), stack = [];
  for (let i = 0; i < m.length; i++) if (m[i] >= hi) { res[i] = 1; stack.push(i); }
  while (stack.length) {
    const i = stack.pop();
    for (const o of [-w-1, -w, -w+1, -1, 1, w-1, w, w+1]) {
      const j = i + o;
      if (j >= 0 && j < m.length && !res[j] && m[j] >= lo) { res[j] = 1; stack.push(j); }
    }
  }
  return res;
}

// ---- Main loop ---------------------------------------------------------
let last = performance.now(), fps = 0;

function loop(now) {
  if (video.readyState >= 2) {
    const w = work.width, h = work.height;
    wctx.drawImage(video, 0, 0, w, h);
    const img = wctx.getImageData(0, 0, w, h);

    let g = toGray(img);
    const b = +$('blur').value;
    if (b > 0) g = blur(g, w, h, b);

    const t = +$('thresh').value, inv = $('invert').checked;
    const { mag, dir } = sobel(g, w, h);
    const o = octx.createImageData(w, h), d = o.data;

    if ($('method').value === 'sobel') {
      for (let i = 0; i < mag.length; i++) {
        // Soft threshold so you can see edge strength, not just on/off
        let v = mag[i] < t ? 0 : Math.min(255, mag[i] * 2);
        if (inv) v = 255 - v;
        d[i*4] = d[i*4+1] = d[i*4+2] = v; d[i*4+3] = 255;
      }
    } else {
      const edges = hysteresis(thin(mag, dir, w, h), w, h, t * 0.5, t);
      for (let i = 0; i < edges.length; i++) {
        let v = edges[i] ? 255 : 0;
        if (inv) v = 255 - v;
        d[i*4] = d[i*4+1] = d[i*4+2] = v; d[i*4+3] = 255;
      }
    }
    octx.putImageData(o, 0, 0);

    fps = fps * 0.9 + (1000 / (now - last)) * 0.1; last = now;
    $('outCap').textContent = 'Edges · ' + fps.toFixed(0) + ' fps';
  }
  requestAnimationFrame(loop);
}

// ---- UI wiring ---------------------------------------------------------
$('start').onclick = () => startCamera();
$('camera').onchange = e => startCamera(e.target.value);
$('thresh').oninput = e => $('threshVal').textContent = e.target.value;
$('blur').oninput = e => $('blurVal').textContent = e.target.value;
$('sideBySide').onchange = e => {
  $('origFig').style.display = e.target.checked ? '' : 'none';
  $('stage').classList.toggle('single', !e.target.checked);
};
$('full').onclick = () => document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
