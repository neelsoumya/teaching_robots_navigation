<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t1">Robot pose, obstacle and occupancy map</title>
<desc id="d1">A robot at pose (x_R, y_R, theta) in a world frame senses a wall point, which is converted to world coordinates and marked in an occupancy grid.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#2C2C2A}
.ts{font-size:12px;fill:#444441}
.th{font-size:14px;font-weight:bold}
.ax{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.cell{fill:#fff;stroke:#B4B2A9;stroke-width:1}
.occ{fill:#D3D1C7;stroke:#5F5E5A;stroke-width:1}
.hit{fill:#F5C4B3;stroke:#993C1D;stroke-width:1}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="350" fill="#ffffff"/>
<line class="ax" x1="70" y1="310" x2="410" y2="310" marker-end="url(#a)"/>
<line class="ax" x1="70" y1="310" x2="70" y2="40" marker-end="url(#a)"/>
<text class="ts" x="416" y="314">x</text>
<text class="ts" x="62" y="46" text-anchor="end">y</text>
<text class="ts" x="76" y="330">(0, 0) world origin</text>
<line x1="150" y1="70" x2="400" y2="70" stroke="#2C2C2A" stroke-width="3"/>
<text class="ts" x="150" y="92">Wall</text>
<text class="th" x="330" y="50" text-anchor="middle">Obstacle (x_obs, y_obs)</text>
<circle cx="330" cy="70" r="4" fill="#D85A30"/>
<line x1="230" y1="220" x2="330" y2="70" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="ts" x="292" y="142">r in robot frame</text>
<circle cx="230" cy="220" r="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<line x1="242" y1="206" x2="264" y2="190" class="ax" marker-end="url(#a)"/>
<text class="ts" x="274" y="208">heading θ</text>
<text class="th" x="230" y="260" text-anchor="middle">Robot (x_R, y_R, θ)</text>
<line x1="70" y1="310" x2="214" y2="232" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/>
<text class="ts" x="80" y="250">(x_R, y_R)</text>
<line x1="338" y1="72" x2="464" y2="104" stroke="#D85A30" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text class="th" x="530" y="78" text-anchor="middle">Occupancy map</text>
<rect class="hit" x="470" y="90" width="30" height="30"/>
<rect class="occ" x="500" y="90" width="30" height="30"/>
<rect class="occ" x="530" y="90" width="30" height="30"/>
<rect class="occ" x="560" y="90" width="30" height="30"/>
<rect class="cell" x="470" y="120" width="30" height="30"/><rect class="cell" x="500" y="120" width="30" height="30"/><rect class="cell" x="530" y="120" width="30" height="30"/><rect class="cell" x="560" y="120" width="30" height="30"/>
<rect class="cell" x="470" y="150" width="30" height="30"/><rect class="cell" x="500" y="150" width="30" height="30"/><rect class="cell" x="530" y="150" width="30" height="30"/><rect class="cell" x="560" y="150" width="30" height="30"/>
<rect class="cell" x="470" y="180" width="30" height="30"/><rect class="cell" x="500" y="180" width="30" height="30"/><rect class="cell" x="530" y="180" width="30" height="30"/><rect class="cell" x="560" y="180" width="30" height="30"/>
<text class="ts" x="530" y="232" text-anchor="middle">Shaded cells = occupied</text>
<text class="ts" x="530" y="250" text-anchor="middle">Blank cells = free or unknown</text>
</svg>
