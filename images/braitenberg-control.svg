<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t2">Differential-drive obstacle avoidance</title>
<desc id="d2">A top-down robot with left and right range sensors and left and right wheels. Each wheel speed is a constant base speed minus a gain times its own side's sensor reading.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif;fill:#2C2C2A}
.ts{font-size:12px;fill:#444441}
.th{font-size:14px;font-weight:bold}
.eq{font-size:12px;fill:#3C3489}
.eh{font-size:14px;font-weight:bold;fill:#26215C}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>
<text class="ts" x="340" y="118" text-anchor="middle">front</text>
<rect x="290" y="130" width="100" height="90" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="272" y="150" width="16" height="50" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="392" y="150" width="16" height="50" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="th" x="262" y="178" text-anchor="end">V_L</text>
<text class="th" x="418" y="178">V_R</text>
<line x1="305" y1="130" x2="240" y2="66" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="375" y1="130" x2="440" y2="66" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="305" cy="130" r="3" fill="#D85A30"/><circle cx="375" cy="130" r="3" fill="#D85A30"/>
<text class="th" x="236" y="52" text-anchor="middle">Left sensor L_L</text>
<text class="th" x="444" y="52" text-anchor="middle">Right sensor L_R</text>
<path d="M150 270 L150 238 L280 238 L280 204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M530 270 L530 238 L400 238 L400 204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="270" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text class="eh" x="150" y="292" text-anchor="middle">Left wheel command</text>
<text class="eq" x="150" y="312" text-anchor="middle">V_L,total = V_L − k·L_L</text>
<rect x="420" y="270" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text class="eh" x="530" y="292" text-anchor="middle">Right wheel command</text>
<text class="eq" x="530" y="312" text-anchor="middle">V_R,total = V_R − k·L_R</text>
<text class="ts" x="340" y="364" text-anchor="middle">V_L, V_R = constant base speed. k = gain. L = range reading on that side.</text>
</svg>
